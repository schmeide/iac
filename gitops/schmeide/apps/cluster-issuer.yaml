# Let's Encrypt production, HTTP-01 through the Traefik ingress class. No contact email:
# Let's Encrypt stopped sending expiry mail in 2025, and ACME does not require one.
#
# Nothing uses this yet. An Ingress opts in with the annotation
# cert-manager.io/cluster-issuer: letsencrypt once it has a real hostname. See
# gitops/README.md for the hostnames still to be chosen.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # The ClusterIssuer CRD arrives with cert-manager in the same sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
