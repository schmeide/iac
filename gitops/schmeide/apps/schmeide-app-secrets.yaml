# The schmeide.app API's environment, projected from the platform Key Vault into one
# Secret, schmeide-app/schmeide-app, that the Deployment loads with envFrom. The keys are
# the env var names the server reads.
#
# Terraform generates schmeide-app-auth-secret and schmeide-app-postgres-password (see
# azure/schmeide/gitops.tf), so the two `data` entries always resolve. The role that
# password belongs to is created by hand; gitops/README.md has the SQL.
#
# The sign-in providers and the Anthropic key are set by hand in the vault and may be
# absent. They come in through `find`, which returns only the secrets that exist, so a
# missing one leaves its variables empty instead of failing the sync. The server offers a
# provider only when both its id and secret are non-empty.
apiVersion: v1
kind: Namespace
metadata:
  name: schmeide-app
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schmeide-app
  namespace: schmeide-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: schmeide
  target:
    name: schmeide-app
    template:
      engineVersion: v2
      # `index` yields "" for a key find did not return; `.key` would fail the template.
      # The password is alphanumeric (special = false), so it needs no URL escaping.
      data:
        DATABASE_URL: "postgres://schmeide_app:{{ .dbPassword }}@psql-schmeide.postgres.database.azure.com:5432/schmeide?sslmode=require"
        SCHMEIDE_AUTH_SECRET: "{{ .authSecret }}"
        SCHMEIDE_GOOGLE_CLIENT_ID: '{{ index . "schmeide-app-google-client-id" }}'
        SCHMEIDE_GOOGLE_CLIENT_SECRET: '{{ index . "schmeide-app-google-client-secret" }}'
        SCHMEIDE_MICROSOFT_CLIENT_ID: '{{ index . "schmeide-app-microsoft-client-id" }}'
        SCHMEIDE_MICROSOFT_CLIENT_SECRET: '{{ index . "schmeide-app-microsoft-client-secret" }}'
        SCHMEIDE_APPLE_CLIENT_ID: '{{ index . "schmeide-app-apple-client-id" }}'
        SCHMEIDE_APPLE_CLIENT_SECRET: '{{ index . "schmeide-app-apple-client-secret" }}'
        ANTHROPIC_API_KEY: '{{ index . "schmeide-app-anthropic-api-key" }}'
  data:
    - secretKey: authSecret
      remoteRef:
        key: schmeide-app-auth-secret
    - secretKey: dbPassword
      remoteRef:
        key: schmeide-app-postgres-password
  dataFrom:
    - find:
        name:
          regexp: "^schmeide-app-(google|microsoft|apple|anthropic)-"
---
# The schmeide-platform Forgejo user's API token, for the worker only: a Secret of its own, so the
# API's envFrom never loads it. Set by hand (gitops/README.md, "Builds and the worker"). A `data`
# entry, not `find`: the worker cannot start without it, so a missing token should fail loudly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schmeide-app-forgejo
  namespace: schmeide-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: schmeide
  target:
    name: schmeide-app-forgejo
  data:
    - secretKey: token
      remoteRef:
        key: schmeide-app-forgejo-token
---
# The schmeide_provisioner Postgres login, for the worker only: it creates and drops each built
# app's database and role (schmeide/schmeide.app docs/stage2.md, "Databases"). Terraform
# generates the password (azure/schmeide/worker.tf); the role is created by hand (gitops/README.md,
# "The schmeide_provisioner login"). Alphanumeric, so it needs no URL escaping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schmeide-app-provisioner
  namespace: schmeide-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: schmeide
  target:
    name: schmeide-app-provisioner
    template:
      engineVersion: v2
      data:
        url: "postgres://schmeide_provisioner:{{ .password }}@psql-schmeide.postgres.database.azure.com:5432/postgres?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: schmeide-app-provisioner-password
---
# The Azure ids the worker reads, one key per env var: its workload identity's client id, the
# subscription, the registry's resource group and the ACR run identity. Not secrets, but this
# repository does not commit them; terraform writes them as one JSON Key Vault secret
# (azure/schmeide/worker.tf) and extract expands it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schmeide-app-azure
  namespace: schmeide-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: schmeide
  target:
    name: schmeide-app-azure
  dataFrom:
    - extract:
        key: schmeide-app-worker-azure
