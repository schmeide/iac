# The Postgres password Temporal connects with, projected from the platform Key Vault.
# Before the temporal Application (wave 2), so the schema job finds it.
#
# PLACEHOLDER: Temporal uses the server's admin login for now. A dedicated login with
# rights on only its two databases needs a role created inside Postgres, which terraform
# cannot reach from CI on a private server. Replace it once the platform has a way to
# create logins.
apiVersion: v1
kind: Namespace
metadata:
  name: temporal
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: temporal
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: schmeide
  target:
    name: temporal-db
  data:
    - secretKey: password
      remoteRef:
        key: postgres-admin-password
