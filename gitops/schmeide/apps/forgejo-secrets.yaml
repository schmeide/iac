# Forgejo's database password and admin credentials, projected from the platform Key
# Vault. Both values are generated by terraform; see azure/schmeide/gitops.tf and
# modules/postgres/key_vault.tf.
#
# PLACEHOLDER: Forgejo uses the Postgres admin login for now, for the reason given in
# temporal-secrets.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: schmeide
  target:
    name: forgejo-db
  data:
    - secretKey: password
      remoteRef:
        key: postgres-admin-password
---
# The keys are the ones the chart's gitea.admin.existingSecret expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: schmeide
  target:
    name: forgejo-admin
    template:
      engineVersion: v2
      data:
        username: schmeide-admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: forgejo-admin-password
