# Temporal, self-hosted, on the shared Postgres server. Its password Secret comes from
# temporal-secrets.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    # https://go.temporal.io/helm-charts, 1.8.0 (Temporal server 1.32.2) looked up
    # 2026-11-16 from the repository index.
    - repoURL: https://go.temporal.io/helm-charts
      chart: temporal
      targetRevision: 1.8.0
      helm:
        releaseName: temporal
        valueFiles:
          - $values/gitops/schmeide/temporal/values.yaml
    - repoURL: https://github.com/schmeide/iac.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
