# The schmeide.app API, applied by apps/schmeide-app.yaml. Plain manifests; the image tag
# lives only here, and schmeide/schmeide.app's CI changes nothing but newTag (see
# "Deploying schmeide.app" in gitops/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: schmeide-app
resources:
  - pvc.yaml
  - migrate-job.yaml
  - deployment.yaml
  - worker.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: schmeide-app
    newName: schmeide.azurecr.io/schmeide-app
    newTag: "087f393c01c7290f90eb79298dc9d64c00388ee8"
# The worker starts build Jobs from its own image, so SCHMEIDE_BUILD_IMAGE follows the tag above.
# Replacements run after images:, so this copies the full schmeide.azurecr.io/schmeide-app:<sha>.
replacements:
  - source:
      kind: Deployment
      name: schmeide-app-worker
      fieldPath: spec.template.spec.containers.[name=worker].image
    targets:
      - select:
          kind: Deployment
          name: schmeide-app-worker
        fieldPaths:
          - spec.template.spec.containers.[name=worker].env.[name=SCHMEIDE_BUILD_IMAGE].value
