# Database migrations, before anything else in the sync. A failure stops the sync, so the
# new pod never starts against a schema it does not expect. Same image and DATABASE_URL as
# the Deployment; `node src/migrate.ts` exits non-zero when it cannot migrate.
apiVersion: batch/v1
kind: Job
metadata:
  name: schmeide-app-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  # Fail instead of waiting forever on an image that does not pull.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schmeide-app-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: schmeide-app
          command: ["node", "src/migrate.ts"]
          envFrom:
            - secretRef:
                name: schmeide-app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
