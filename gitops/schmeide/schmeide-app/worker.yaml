# The schmeide.app Temporal worker (schmeide/schmeide.app#192, SCHMEIDE_ROLE=worker): spec
# writing, build summaries, deletes, and builds. It serves only /healthz, for probes, so it has
# no Service or Ingress.
#
# Builds run in Kubernetes mode (SCHMEIDE_RUNNER=kubernetes, schmeide/schmeide.app#204/#205):
# the agent and the checks run as Jobs in schmeide-builds and code lives on Forgejo. At startup
# the worker checks its Forgejo token, its rights in schmeide-builds and the anthropic-builds
# Secret, and exits naming whatever is missing.
#
# It shares the API's ReadWriteOnce disk until uploads move to Blob storage (slice 2, #195):
# deletes remove uploads the API wrote, and claude keeps its config under /data. A ReadWriteOnce
# Azure disk attaches to one node, so the worker is required on the API pod's node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schmeide-app-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: schmeide-app-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schmeide-app-worker
        # Azure Workload Identity projects a token for id-schmeide-worker (azure/schmeide/worker.tf)
        # and sets AZURE_TENANT_ID, AZURE_FEDERATED_TOKEN_FILE and AZURE_AUTHORITY_HOST. The
        # service account carries no client-id annotation, since the repo does not commit ids;
        # AZURE_CLIENT_ID comes from schmeide-app-azure below, and the webhook keeps it.
        azure.workload.identity/use: "true"
    spec:
      # Its rights are in apps/schmeide-worker.yaml. The token is what it calls the Kubernetes API
      # with, to run build Jobs.
      serviceAccountName: schmeide-worker
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: schmeide-app-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: schmeide-app
          ports:
            - name: health
              containerPort: 3100
          env:
            - name: SCHMEIDE_ROLE
              value: worker
            # The API (deployment.yaml) decides who may build, admins only for now; the worker
            # builds whatever reaches it.
            - name: SCHMEIDE_BUILDS
              value: "on"
            - name: SCHMEIDE_RUNNER
              value: kubernetes
            # Build Jobs run the worker's own image. The placeholder is replaced with this
            # container's image, after the kustomization's images: tag, by the replacement in
            # kustomization.yaml.
            - name: SCHMEIDE_BUILD_IMAGE
              value: schmeide-app
            # fetch trusts the cluster's CA for the Kubernetes API through this.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            # SCHMEIDE_FORGEJO_URL and SCHMEIDE_FORGEJO_SSH default to the forgejo-http (3000) and
            # forgejo-ssh (22) Services in the forgejo namespace, and the build Postgres sidecar to
            # schmeide.azurecr.io/mirror/postgres:18-alpine.
            - name: SCHMEIDE_HOST
              value: 0.0.0.0
            - name: PORT
              value: "3100"
            - name: SCHMEIDE_DATA_DIR
              value: /data
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: HOME
              value: /data
            - name: TMPDIR
              value: /tmp
            # See deployment.yaml: swc's cache check fails on every writable dir in the pod.
            - name: SWC_NATIVE_BINDING_CACHE
              value: /tmp/swc
            - name: SWC_NATIVE_BINDING_CACHE_SKIP_SECURITY_CHECK
              value: "1"
            # Only the keys the worker reads, so it never holds the auth secret or the
            # sign-in providers' credentials.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: schmeide-app
                  key: DATABASE_URL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: schmeide-app
                  key: ANTHROPIC_API_KEY
            # The schmeide-platform Forgejo user's token, in a Secret the API never loads.
            - name: SCHMEIDE_FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: schmeide-app-forgejo
                  key: token
            # Deploys (schmeide/schmeide.app#194): images built by ACR runs into apps/*, apps
            # served at <host>.apps.schmeide.com, one database per copy on the shared server.
            - name: SCHMEIDE_ACR_NAME
              value: schmeide
            - name: SCHMEIDE_ACR_LOGIN_SERVER
              value: schmeide.azurecr.io
            - name: SCHMEIDE_APPS_DOMAIN
              value: apps.schmeide.com
            - name: SCHMEIDE_APP_DATABASE_HOST
              value: psql-schmeide.postgres.database.azure.com
            # schmeide_provisioner (CREATEDB, CREATEROLE) on database postgres.
            - name: SCHMEIDE_PROVISIONER_URL
              valueFrom:
                secretKeyRef:
                  name: schmeide-app-provisioner
                  key: url
          # AZURE_CLIENT_ID, SCHMEIDE_AZURE_SUBSCRIPTION_ID, SCHMEIDE_ACR_RESOURCE_GROUP,
          # SCHMEIDE_ACR_RUN_IDENTITY (client id) and SCHMEIDE_ACR_RUN_IDENTITY_ID (resource id),
          # from terraform through Key Vault (apps/schmeide-app-secrets.yaml).
          envFrom:
            - secretRef:
                name: schmeide-app-azure
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          # /healthz answers 200 once the Temporal worker runs; bundling the workflows takes
          # a few seconds at startup.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: schmeide-app-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
