# The schmeide.app Temporal worker (schmeide/schmeide.app#192, SCHMEIDE_ROLE=worker): spec
# writing, build summaries, deletes, and later builds. It serves only /healthz, for probes, so
# it has no Service or Ingress.
#
# It shares the API's ReadWriteOnce disk until uploads move to Blob storage (slice 2, #195):
# deletes remove uploads the API wrote, and claude keeps its config under /data. A ReadWriteOnce
# Azure disk attaches to one node, so the worker is required on the API pod's node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schmeide-app-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: schmeide-app-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schmeide-app-worker
    spec:
      # Until builds run as Kubernetes Jobs (#193), the worker needs no Kubernetes API access.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: schmeide-app-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: schmeide-app
          ports:
            - name: health
              containerPort: 3100
          env:
            - name: SCHMEIDE_ROLE
              value: worker
            - name: SCHMEIDE_BUILDS
              value: "off"
            - name: SCHMEIDE_HOST
              value: 0.0.0.0
            - name: PORT
              value: "3100"
            - name: SCHMEIDE_DATA_DIR
              value: /data
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: HOME
              value: /data
            - name: TMPDIR
              value: /tmp
            # See deployment.yaml: swc's cache check fails on every writable dir in the pod.
            - name: SWC_NATIVE_BINDING_CACHE
              value: /tmp/swc
            - name: SWC_NATIVE_BINDING_CACHE_SKIP_SECURITY_CHECK
              value: "1"
            # Only the keys the worker reads, so it never holds the auth secret or the
            # sign-in providers' credentials.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: schmeide-app
                  key: DATABASE_URL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: schmeide-app
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          # /healthz answers 200 once the Temporal worker runs; bundling the workflows takes
          # a few seconds at startup.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: schmeide-app-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
