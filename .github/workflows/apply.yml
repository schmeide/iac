# Terraform apply. Runs on push to main -- so an apply always corresponds to a reviewed,
# merged commit -- and on manual dispatch for recovery.
#
# Plan and apply run in one job, so the planfile never leaves the runner. A planfile embeds
# the configuration and a snapshot of state, secrets included, and an artifact in a public
# repo can be downloaded by any signed-in GitHub user. Applying the planfile rather than
# source still means what gets applied is exactly what this job planned.
#
# INERT UNTIL THE SUBSCRIPTION EXISTS. Every job here is gated on the AZURE_ENABLED
# repository variable, so with it unset the run shows the job as skipped rather than
# failing on a login to a subscription that does not exist. README.md, "Bringing the
# subscription online", has the steps that end with setting it to true.
name: Apply
on:
  push:
    branches:
      - main
    # Terraform reads neither. gitops/ is Argo's: schmeide.app's CD commits a new image tag
    # there on every deploy, and each of those would otherwise run a no-op plan and apply.
    # A push that also touches a .tf file still runs.
    paths-ignore:
      - "gitops/**"
      - "**.md"
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  # Never cancel an apply mid-flight. A half-applied change leaves Azure and the state file
  # disagreeing, which is strictly worse than an apply that waited its turn.
  cancel-in-progress: false
env:
  TERRAFORM_VERSION: "1.16.0"
jobs:
  apply:
    if: vars.AZURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # GitHub creates this environment on first use with no protection rules, so it changes
    # nothing today. It exists so required reviewers, a wait timer, or branch restrictions
    # can be added later in repo settings without touching this file.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # The wrapper rewrites terraform's exit codes, which `make plan` relies on.
          terraform_wrapper: false

      # helm_release runs kubelogin during plan and apply. local_account_disabled means
      # there is no admin client certificate to fall back to.
      - name: Install kubelogin
        run: az aks install-cli

      - name: Init
        run: |
          make init

      - name: Plan
        run: |
          make plan

      - name: Apply
        run: |
          make apply-from-planfile
